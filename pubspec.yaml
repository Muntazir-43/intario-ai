name: intario_ai
description: AI-powered interior design app using Decor8 AI API.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  google_nav_bar: ^5.0.6

  # Navigation
  go_router: ^14.2.7

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.7.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_storage: ^12.3.2

  # Image handling
  image_picker: ^1.1.2

  # Local storage
  shared_preferences: ^2.3.2

  # File system
  path_provider: ^2.1.4

  # Formatting
  intl: ^0.19.0

  # Gallery saving
  gal: ^2.3.2

  # Share
  share_plus: ^10.0.2

  # UI
  cupertino_icons: ^1.0.8

  # Splash Screen Requirements
  video_player: ^2.9.1
  flutter_native_splash: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

# Native Splash Configuration: PURE WHITE
flutter_native_splash:
  color: "#FFFFFF"
  android_12:
    color: "#FFFFFF"
  fullscreen: true

# Senior Branding Engineer's Optimized Config
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo_icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo_icon/app_icon.png"
  # Inset of 16 ensures the logo occupies ~66% of the canvas (The Golden Ratio for Icons)
  # This prevents the logo from feeling "cramped" on One Samsung or Pixel masks.
  adaptive_icon_foreground_inset: 16

flutter:
  uses-material-design: true

  assets:
    - assets/images/styles/
    - assets/images/garden/
    - assets/images/features/
    - assets/logo_icon/
    - assets/splash_screen/Intario_Splash_Screen.mp4
